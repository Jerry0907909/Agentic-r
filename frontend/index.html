<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agentic RAG 对话</title>
  <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/styles/github.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body, #app {
      height: 100%;
    }

    .el-container {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #409eff;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }

    .header h2 {
      font-size: 18px;
      font-weight: 600;
      margin-right: 40px;
    }

    .header-menu {
      display: flex;
      align-items: center;
      height: 100%;
      flex: 1;
    }

    .header-menu .menu-item {
      height: 100%;
      display: flex;
      align-items: center;
      padding: 0 20px;
      cursor: pointer;
      font-size: 15px;
      color: rgba(255, 255, 255, 0.85);
      transition: background 0.2s, color 0.2s;
      border-bottom: 3px solid transparent;
    }

    .header-menu .menu-item:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .header-menu .menu-item.active {
      color: #fff;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.15);
      border-bottom-color: #fff;
    }

    .chat-main {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16%;
    }

    .empty-hint {
      text-align: center;
      color: #c0c4cc;
      font-size: 14px;
      margin-top: 40px;
    }

    .message-row {
      display: flex;
      margin-bottom: 16px;
      align-items: flex-start;
    }

    .message-row.user {
      flex-direction: row-reverse;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
      margin: 0 10px;
    }

    .bubble {
      max-width: 70%;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.6;
      word-break: break-word;
    }

    .bubble.user {
      background: #409eff;
      color: #fff;
      border-bottom-right-radius: 2px;
    }

    .bubble.assistant {
      background: #fff;
      color: #303133;
      border: 1px solid #e4e7ed;
      border-bottom-left-radius: 2px;
    }

    /* Markdown body inside bubble */
    .markdown-body {
      font-size: 14px;
      line-height: 1.7;
    }

    .markdown-body p {
      margin: 4px 0;
    }

    .markdown-body pre {
      background: #f6f8fa;
      border: 1px solid #e1e4e8;
      border-radius: 6px;
      padding: 12px;
      overflow-x: auto;
      margin: 8px 0;
    }

    .markdown-body code {
      font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
      font-size: 13px;
    }

    .markdown-body p > code {
      background: #f0f0f0;
      padding: 2px 6px;
      border-radius: 3px;
      color: #d63384;
    }

    .markdown-body ul, .markdown-body ol {
      padding-left: 20px;
      margin: 4px 0;
    }

    .markdown-body h1, .markdown-body h2, .markdown-body h3 {
      margin: 10px 0 6px;
    }

    .markdown-body h1 { font-size: 18px; }
    .markdown-body h2 { font-size: 16px; }
    .markdown-body h3 { font-size: 15px; }

    .markdown-body blockquote {
      border-left: 4px solid #409eff;
      padding-left: 12px;
      color: #606266;
      margin: 8px 0;
    }

    .markdown-body table {
      border-collapse: collapse;
      margin: 8px 0;
      width: 100%;
    }

    .markdown-body th, .markdown-body td {
      border: 1px solid #e4e7ed;
      padding: 6px 10px;
      text-align: left;
    }

    .markdown-body th {
      background: #f5f7fa;
      font-weight: 600;
    }

    /* Thinking indicator */
    .thinking-text {
      color: #909399;
      font-size: 14px;
      animation: pulse 1.5s ease-in-out infinite;
    }

    /* Cursor blinking effect */
    .cursor {
      display: inline-block;
      color: #409eff;
      font-weight: bold;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .cursor.blinking {
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .input-footer {
      padding: 12px 16%;
      background: #fff;
      border-top: 1px solid #e4e7ed;
    }
    @media (max-width: 768px) {
      .chat-main { padding: 12px 5%; }
      .input-footer { padding: 12px 5%; }
      .bubble { max-width: 85%; }
      .header h2 { font-size: 15px; margin-right: 16px; }
      .header-menu .menu-item { padding: 0 10px; font-size: 13px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <el-container>
      <el-header class="header">
        <h2>🤖 Agentic RAG 对话</h2>
        <div class="header-menu">
          <div
            class="menu-item"
            :class="{ active: activeTab === 'rag' }"
            @click="switchTab('rag')"
          >Agentic RAG 对话</div>
          <div
            class="menu-item"
            :class="{ active: activeTab === 'graph' }"
            @click="switchTab('graph')"
          >医疗疾病问答</div>
        </div>
      </el-header>

      <el-main class="chat-main" ref="chat">
        <div v-if="messages.length === 0" class="empty-hint">
          {{ emptyHint }}
        </div>
        <div v-for="(msg, idx) in messages" :key="idx" :class="['message-row', msg.role]">
          <div class="avatar" v-if="msg.role === 'assistant'">🤖</div>
          <div class="avatar" v-else>👤</div>
          <div :class="['bubble', msg.role]">
            <div v-if="msg.role === 'assistant'" class="markdown-body" v-html="renderMarkdown(msg.content)"></div>
            <div v-else>{{ msg.content }}</div>
          </div>
        </div>
        <div v-if="loading" class="message-row assistant">
          <div class="avatar">🤖</div>
          <div class="bubble assistant">
            <div v-if="currentAnswer" class="markdown-body" v-html="renderMarkdown(currentAnswer)"></div>
            <span v-if="currentAnswer" class="cursor">▍</span>
            <span v-else class="thinking-text">🤖 正在思考中...</span>
          </div>
        </div>
      </el-main>

      <el-footer class="input-footer">
        <el-input
          v-model="input"
          :placeholder="inputPlaceholder"
          @keyup.enter.native="sendMessage"
          :disabled="loading"
          size="medium"
          class="chat-input"
        >
          <el-button
            slot="append"
            type="primary"
            @click="sendMessage"
            :loading="loading"
            icon="el-icon-s-promotion"
          >发送</el-button>
        </el-input>
      </el-footer>
    </el-container>
  </div>

  <script src="https://unpkg.com/vue@2.7.16/dist/vue.min.js"></script>
  <script src="https://unpkg.com/element-ui/lib/index.js"></script>
  <script src="https://unpkg.com/marked@4.3.0/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/highlight.min.js"></script>
  <script>
    /* global Vue, marked, hljs */

    marked.setOptions({
      breaks: true,
      highlight: function (code, lang) {
        if (lang && hljs.getLanguage(lang)) {
          try {
            return hljs.highlight(code, { language: lang }).value;
          } catch (e) {}
        }
        try {
          return hljs.highlightAuto(code).value;
        } catch (e) {
          return code;
        }
      }
    });

    var app = new Vue({
      el: '#app',
      data: function () {
        return {
          activeTab: 'rag',          // 当前激活的 tab：'rag' | 'graph'
          sessions: {
            rag: {
              messages: [],
              input: '',
              currentAnswer: ''
            },
            graph: {
              messages: [],
              input: '',
              currentAnswer: ''
            }
          },
          loading: false,
          abortController: null
        };
      },
      computed: {
        // 当前会话对象
        currentSession: function () {
          return this.sessions[this.activeTab];
        },
        // 当前消息列表
        messages: function () {
          return this.currentSession.messages;
        },
        // 当前输入框内容
        input: {
          get: function () {
            return this.currentSession.input;
          },
          set: function (val) {
            this.currentSession.input = val;
          }
        },
        // 当前流式回答
        currentAnswer: {
          get: function () {
            return this.currentSession.currentAnswer;
          },
          set: function (val) {
            this.currentSession.currentAnswer = val;
          }
        },
        // 空状态提示
        emptyHint: function () {
          return this.activeTab === 'rag'
            ? '输入问题开始 Agentic RAG 对话'
            : '输入医疗疾病问题开始问答';
        },
        // 输入框占位符
        inputPlaceholder: function () {
          return this.activeTab === 'rag'
            ? '请输入你的问题...'
            : '请输入医疗疾病相关问题...';
        },
        // 当前接口地址
        apiUrl: function () {
          return this.activeTab === 'rag'
            ? 'http://localhost:8000/api/ask'
            : 'http://localhost:8000/api/ask_graph';
        }
      },
      methods: {
        // 切换 tab
        switchTab: function (tab) {
          if (this.loading) {
            this.$message.warning('请等待当前回答完成后再切换');
            return;
          }
          this.activeTab = tab;
          this.scrollToBottom();
        },

        renderMarkdown: function (text) {
          if (!text) return '';
          return marked.parse(text);
        },

        scrollToBottom: function () {
          this.$nextTick(function () {
            var container = this.$refs.chat;
            if (container) {
              container.scrollTop = container.scrollHeight;
            }
          });
        },

        sendMessage: function () {
          var question = this.input.trim();
          if (!question || this.loading) return;

          // 记录当前 tab（防止流式过程中切换 tab 导致消息串台）
          var tab = this.activeTab;
          var session = this.sessions[tab];

          session.messages.push({ role: 'user', content: question });
          session.input = '';
          this.loading = true;
          session.currentAnswer = '';
          this.scrollToBottom();

          this.abortController = new AbortController();

          var self = this;
          var url = (tab === 'rag')
            ? 'http://localhost:8000/api/ask'
            : 'http://localhost:8000/api/ask_graph';

          fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question: question }),
            signal: this.abortController.signal
          }).then(function (response) {
            if (!response.ok) {
              throw new Error('请求失败: ' + response.status);
            }
            return response.body.getReader();
          }).then(function (reader) {
            var decoder = new TextDecoder();
            var buffer = '';

            function read() {
              return reader.read().then(function (result) {
                if (result.done) {
                  self.loading = false;
                  if (session.currentAnswer) {
                    session.messages.push({ role: 'assistant', content: session.currentAnswer });
                    session.currentAnswer = '';
                    self.scrollToBottom();
                  }
                  return;
                }

                buffer += decoder.decode(result.value, { stream: true });

                var lines = buffer.split('\n');
                buffer = lines.pop();

                for (var i = 0; i < lines.length; i++) {
                  var line = lines[i].trim();
                  if (!line) continue;
                  try {
                    var data = JSON.parse(line);
                    if (data.c) {
                      session.currentAnswer += data.c;
                      self.scrollToBottom();
                    } else if (data.err) {
                      self.$message.error('服务端错误: ' + data.err);
                    }
                  } catch (e) {}
                }

                return read();
              });
            }

            return read();
          }).catch(function (err) {
            if (err.name === 'AbortError') return;
            self.$message.error('请求失败: ' + err.message);
            self.loading = false;
          });
        }
      }
    });
  </script>
</body>
</html>
